# ============================================================
# Blueprint của Render.com — khai báo SẴN toàn bộ hạ tầng của dự án iMob.
#
# Thay vì vào web Render bấm tạo từng dịch vụ rồi điền tay hàng chục ô, ta mô tả
# mọi thứ trong file này. Trên Render bấm: New + -> Blueprint -> chọn repo
# Web-iMob -> Apply. Render đọc file này và dựng đủ 2 dịch vụ.
#
# Dự án có 3 phần:
#   1. imob-db          — PostgreSQL: nội dung CMS + thông tin khách để lại
#   2. imob-chatbot-api — API Python (FastAPI), thư mục chatbot-python/
#   3. imob-web         — website React, Vite build ra thư mục dist/
#
# Sửa file này rồi push lên GitHub thì Render tự cập nhật theo.
# Tài liệu: https://render.com/docs/blueprint-spec
# ============================================================

# ----------------------------------------------------------
# Database — nơi lưu nội dung sửa trong /admin và các liên hệ khách để lại.
#
# ⚠️ GÓI FREE CÓ THỜI HẠN: hết hạn Render XÓA database, tức là mất hết nội dung
# đã sửa và toàn bộ danh sách liên hệ. Hãy kiểm tra hạn trên trang Render.
# Hai cách phòng:
#   • Vào /admin bấm "Xuất JSON" định kỳ, chép đè vào src/data/ rồi commit.
#   • Hoặc dùng database bên ngoài (Neon, Supabase) có gói free dài hơi hơn —
#     chỉ cần đổi DATABASE_URL bên dưới, code không phải sửa gì.
#
# Website KHÔNG chết khi mất database: nó vẫn còn bản JSON đóng gói sẵn trong
# bundle làm mặc định (xem src/context/NoiDungContext.jsx).
# ----------------------------------------------------------
databases:
  - name: imob-db
    plan: free
    region: singapore
    databaseName: imob
    user: imob

services:
  # ----------------------------------------------------------
  # 1) API chatbot Python (FastAPI + scikit-learn)
  # ----------------------------------------------------------
  - type: web
    name: imob-chatbot-api
    runtime: python
    plan: free
    region: singapore # đặt máy chủ ở Singapore cho gần khách Việt Nam
    rootDir: chatbot-python # coi thư mục này là gốc: requirements.txt, main.py nằm ở đây
    buildCommand: pip install -r requirements.txt
    # $PORT do Render cấp lúc chạy, KHÔNG được ghi cứng 8000.
    # --host 0.0.0.0 để nhận request từ bên ngoài (mặc định chỉ nghe trong máy).
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health # Render gọi đường dẫn này để biết service còn sống
    autoDeploy: true # push lên nhánh main là tự deploy lại
    # Chỉ build lại API khi thư mục chatbot-python/ có thay đổi — sửa giao diện
    # web thì khỏi phải chờ cài lại scikit-learn (mất vài phút).
    buildFilter:
      paths:
        - chatbot-python/**
    envVars:
      # Ghim phiên bản Python cho lần nào build cũng giống nhau.
      # Nếu Render báo lỗi không tìm thấy bản này, đổi sang bản khác (vd 3.13.2)
      # hoặc xóa hẳn biến này để Render dùng bản mặc định của nó.
      - key: PYTHON_VERSION
        value: "3.12.11"

      # ⚠️ TÊN MIỀN WEBSITE — PHẢI ĐIỀN TAY SAU LẦN DEPLOY ĐẦU TIÊN.
      # Render hay thêm hậu tố ngẫu nhiên (imob-web -> imob-web-fqhq) nên không
      # đoán trước được. Điền sai thì trình duyệt chặn hết: chatbot, form liên
      # hệ và trang quản trị đều không chạy.
      # Dạng: https://imob-web-xxxx.onrender.com (nhiều tên miền thì cách nhau
      # bằng dấu phẩy). Sửa xong service tự khởi động lại, KHÔNG cần build lại.
      - key: ALLOWED_ORIGINS
        sync: false

      # --- Google Gemini (TÙY CHỌN) ---
      # Khi kho kiến thức trong máy không trả lời được, bot hỏi tiếp Gemini
      # (xem imob_bot/gemini.py). Không đặt khoá thì tầng này tự tắt, bot chạy
      # y như trước — không có gì hỏng.
      #
      # ⚠️ ĐẶT Ở ĐÂY, TUYỆT ĐỐI KHÔNG ĐẶT Ở VERCEL DƯỚI DẠNG VITE_GEMINI_API_KEY.
      # Mọi biến VITE_* bị nhét thẳng vào file JavaScript công khai, ai mở F12
      # cũng copy được khoá rồi tiêu quota của công ty.
      #
      # sync: false = Render KHÔNG lấy giá trị từ file này (file nằm trong repo
      # công khai). Vào Dashboard -> imob-chatbot-api -> Environment -> điền tay.
      # Lấy khoá tại https://aistudio.google.com/ (bấm "Get API key").
      # Kiểm đã bật chưa: mở /health, xem trường "gemini" là "bat" hay "tat".
      - key: GEMINI_API_KEY
        sync: false

      # --- Phần CMS ---
      # Render tự điền chuỗi kết nối của database khai báo ở trên.
      - key: DATABASE_URL
        fromDatabase:
          name: imob-db
          property: connectionString

      # Khóa ký "vé" đăng nhập. generateValue: Render tự sinh chuỗi ngẫu nhiên
      # và KHÔNG ai nhìn thấy, kể cả bạn — đúng như một khóa bí mật nên vậy.
      # Đổi giá trị này = mọi người đang đăng nhập bị đá ra, phải vào lại.
      - key: JWT_SECRET
        generateValue: true

      # Tài khoản quản trị, chỉ dùng để TẠO lần đầu. sync: false = Render hỏi
      # bạn lúc bấm Apply. Mật khẩu phải từ 8 ký tự trở lên.
      - key: ADMIN_USER
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

  # ----------------------------------------------------------
  # 2) Website React (Vite) — chạy dạng file tĩnh trên CDN, miễn phí và
  #    không bao giờ "ngủ" như web service.
  # ----------------------------------------------------------
  - type: web
    name: imob-web
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeploy: true
    buildFilter:
      ignoredPaths:
        - chatbot-python/**
    # SPA rewrite — BẮT BUỘC với React Router.
    # Site này chỉ có đúng một file index.html. Khách gõ thẳng
    # /zalo-miniapp thì Render đi tìm file tên "zalo-miniapp" -> không có -> 404.
    # Luật dưới bảo Render: đường dẫn nào không phải file thật thì cứ trả
    # index.html, để React Router tự quyết định hiện trang nào.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # File trong /assets đều có mã băm trong tên (index-a1b2c3.js), nội dung
      # đổi là tên đổi -> cho trình duyệt cache thoải mái 1 năm.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    envVars:
      # LƯU Ý: biến VITE_* được nhúng THẲNG vào file JS lúc build, ai xem mã
      # nguồn trang web cũng đọc được. Tuyệt đối không để mật khẩu / khóa bí mật
      # thật ở đây.
      - key: VITE_USE_BACKEND
        value: "true"
      # ⚠️ ĐỊA CHỈ API — PHẢI ĐIỀN TAY SAU LẦN DEPLOY ĐẦU TIÊN.
      #
      # Bản trước dùng `fromService` + `property: host`. Nó CÓ điền, nhưng điền
      # tên miền NỘI BỘ — đúng bằng tên dịch vụ, ví dụ "imob-chatbot-api".
      # Tên đó chỉ dùng được khi hai dịch vụ trên Render gọi nhau bên trong;
      # trình duyệt của khách không phân giải nổi "https://imob-chatbot-api"
      # nên mọi lời gọi API đều chết và trang /admin không đăng nhập được.
      # Website là trang TĨNH chạy trên máy khách, nên bắt buộc phải dùng tên
      # miền CÔNG KHAI (…onrender.com).
      #
      # Thêm nữa, Render hay thêm hậu tố ngẫu nhiên khi tên đã bị dùng
      # (imob-chatbot-api -> imob-chatbot-api-a1b2), nên không thể đoán trước
      # tên miền lúc viết file này.
      #
      # sync: false = Render hỏi bạn giá trị. Lần đầu chưa biết thì cứ để tạm,
      # deploy xong copy đúng địa chỉ API rồi quay lại sửa và bấm
      # "Clear build cache & deploy" — biến VITE_* chỉ có tác dụng LÚC BUILD.
      - key: VITE_API_URL
        sync: false
      # Khóa Gemini (tùy chọn). sync: false = Render sẽ HỎI giá trị lúc bấm
      # Apply. Không có khóa thì để trống, chatbot vẫn chạy bằng kho kiến thức.
      - key: VITE_GEMINI_API_KEY
        sync: false

      # Dòng gợi ý tài khoản hiện trên trang /admin.
      # ⚠️ ĐỂ TRỐNG trên website thật — có đặt là ai vào /admin cũng đọc được
      # mật khẩu và sửa được nội dung. Chỉ điền khi đây là bản trình diễn, và
      # điền đúng cặp ADMIN_USER / ADMIN_PASSWORD bạn vừa đặt ở trên.
      - key: VITE_DEMO_LOGIN
        sync: false
