  Trang chatbot riêng: https://chatbot.imob.vn

  Yêu cầu của lãnh đạo (02/10/2026): một "không gian mới" chỉ để hỏi đáp,
  KHÔNG có tin tức hay quảng cáo dịch vụ iMob — chỉ logo và hotline — để người
  dùng không khó chịu hay nghi bị "bán hàng trá hình". Link này dùng để đi
  truyền thông. Sau này có thể thêm mục bài viết trải nghiệm các địa phương.

  Trang KHÔNG tự chạy AI: nó chèn khung chat của nền tảng iMob CMS (kho
  "Web iMob", cùng kho với bot trên imob.vn) rồi dùng CSS kéo khung chat từ góc
  phải ra giữa, chiếm gần hết màn hình. Cấu hình bot: xem
  src/components/chatbot/botNenTang.js của website chính.

  Đứng TÁCH khỏi app React: một file tĩnh, không build. nginx trỏ thẳng
  chatbot.imob.vn vào thư mục này trong bản đang chạy (/var/www/imob/current/
  trang-chatbot), nên mỗi lần triển khai website là trang này cập nhật theo.
  ============================================================
-->

<style>
  :root {
    --brand: #4318d9;
    --brand-deep: #2c0fa3;
    --chu: #1f2340;
    --chu-nhat: #5a607a;
    --nen-tren: #f3f1fd;
    --nen-duoi: #e9f4f1; /* xanh ngọc rất nhạt — màu nước vịnh */
    --nui: #2f7a6b;
    --cao-dau: 64px;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    /* Cột dọc: đầu trang / khung chat / dòng lưu ý. Khung chat của nền tảng tự
       gắn vào CUỐI <body>, nên dùng "order" để đưa nó lên giữa. */
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh; /* điện thoại: co lại khi bàn phím bật lên */
    overflow: hidden;
    font-family: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--chu);
    background: linear-gradient(180deg, var(--nen-tren) 0%, var(--nen-duoi) 100%);
    position: relative;
  }

  /* Dãy núi đá vôi mờ ở đáy trang — gợi vịnh Hạ Long, không tranh chỗ với chat. */
  .nui {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    width: 100%;
    height: 26vh;
    color: var(--nui);
    opacity: 0.08;
    pointer-events: none;
    z-index: 0;
  }

  .dau {
    order: 0;
    flex: 0 0 var(--cao-dau);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 0 max(16px, env(safe-area-inset-left));
    position: relative;
    z-index: 2;
  }
  .logo { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--chu); }
  .logo img { width: 36px; height: 36px; display: block; }
  .logo span { font-weight: 600; font-size: 18px; letter-spacing: -0.01em; }
  .hotline {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 9px 16px;
    border-radius: 999px;
    background: #fff;
    color: var(--brand);
    font-weight: 600;
    font-size: 15px;
    text-decoration: none;
    box-shadow: 0 1px 2px rgba(31, 35, 64, 0.08), 0 0 0 1px rgba(67, 24, 217, 0.12);
    transition: background-color 0.15s, color 0.15s;
    white-space: nowrap;
  }
  .hotline:hover { background: var(--brand); color: #fff; }
  .hotline:focus-visible, .logo:focus-visible { outline: 3px solid var(--brand); outline-offset: 3px; }
  .hotline svg { width: 16px; height: 16px; flex: none; }

  .an-di { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* Chỗ giữ trong lúc khung chat của nền tảng đang tải (thường dưới 1 giây). */
  .cho {
    order: 1;
    flex: 1 1 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    text-align: center;
    color: var(--chu-nhat);
    position: relative;
    z-index: 1;
  }
  .cho p { margin: 0; max-width: 34ch; line-height: 1.6; }
  .cho a { color: var(--brand); font-weight: 600; }
  body:has(.imob-widget-container) .cho { display: none; }

  .luu-y {
    order: 2;
    flex: 0 0 auto;
    margin: 0;
    padding: 6px 16px max(10px, env(safe-area-inset-bottom));
    text-align: center;
    font-size: 12px;
    color: var(--chu-nhat);
    position: relative;
    z-index: 2;
  }

  /* ------------------------------------------------------------
     KÉO KHUNG CHAT CỦA NỀN TẢNG RA GIỮA TRANG
     CSS của nền tảng đặt khung chat cố định ở góc phải dưới, có nút tròn để
     mở/đóng. Ở đây khung chat LÀ cả trang: luôn mở, không có nút tròn, không
     có nút X. Bộ chọn bắt đầu bằng "html body" để thắng CSS của nền tảng,
     kể cả các quy tắc cho điện thoại (@media max-width 480px) của họ.
     ------------------------------------------------------------ */
  html body .imob-widget-container {
    order: 1;
    position: relative;
    inset: auto;
    width: 100%;
    align-self: stretch;
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    justify-content: center;
    padding: 4px 16px 0;
    z-index: 1;
  }
  html body .imob-widget-container .imob-chatbox {
    position: relative;
    inset: auto;
    width: 100%;
    max-width: 780px;
    margin: 0 auto; /* căn giữa — "justify-content" của khung ngoài không ăn */
    height: 100%;
    max-height: none;
    opacity: 1;
    transform: none;
    pointer-events: auto;
  }
  html body #imob-toggle-btn,
  html body #imob-close-btn { display: none; }

  @media (max-width: 480px) {
    :root { --cao-dau: 56px; }
    .logo span { display: none; }
    .hotline { padding: 8px 14px; font-size: 14px; }
    html body .imob-widget-container { padding: 0 8px; }
    html body .imob-widget-container .imob-chatbox { border-radius: 20px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .hotline { transition: none; }
  }
</style>
</head>

  <h1 class="an-di">Trợ lý ảo du lịch Quảng Ninh</h1>

  <div class="cho" id="cho" role="status">
    <p>Đang mở trợ lý ảo…</p>
  </div>

  <p class="luu-y">Câu trả lời do trợ lý AI tổng hợp, có thể chưa chính xác. Vui lòng kiểm tra lại trước khi đi.</p>

<script>
  // Khung chat của nền tảng iMob CMS — kho "Web iMob". Khoá này vốn công khai
  // (nằm trong mã của mọi trang có khung chat); thứ bảo vệ nó là danh sách tên
  // miền cho phép bên nền tảng. Giữ giống src/components/chatbot/botNenTang.js.
  var GOC_BOT = "https://imob.hangdaaodieu.com";
  var PHIEN_BAN_BOT = "20260926-suggestions-3";
  var KHOA_BOT = "imob_live_p6rkc41dBMhR6gUEG87df1D6uaxQMC4";

  (function () {
    var css = document.createElement("link");
    css.rel = "stylesheet";
    // PHẢI có /widget/: thiếu thì máy chủ vẫn trả 200 nhưng là trang HTML.
    css.href = GOC_BOT + "/widget/widget.css?v=" + PHIEN_BAN_BOT;
    // Chèn TRƯỚC thẻ <style> của trang để CSS của trang được áp sau, thắng.
    document.head.insertBefore(css, document.head.querySelector("style"));

    var js = document.createElement("script");
    js.src = GOC_BOT + "/widget/widget.min.js?v=" + PHIEN_BAN_BOT;
    js.async = true;
    js.dataset.apiKey = KHOA_BOT;
    js.dataset.apiBase = GOC_BOT;
    document.body.appendChild(js);

    // Bấm hộ nút tròn một lần để khung chat ở trạng thái "đang mở" bên trong
    // mã của nền tảng (CSS ở trên chỉ lo phần nhìn; không bấm thì khung chat
    // trống trơn).
    //
    // ⚠️ PHẢI CHỜ lượt gọi /api/v1/chat/init XONG rồi mới bấm. Bấm sớm hơn thì
    // khung chat hiện lời chào mặc định "Xin chào! Tôi là trợ lý ảo…" và KHÔNG
    // có câu gợi ý — lời chào + gợi ý của kho đến từ lượt gọi đó (đã thử
    // 02/10/2026). Biết lượt gọi xong nhờ PerformanceObserver: trình duyệt ghi
    // một mục "resource" khi tải xong một địa chỉ.
    var daInit = false;
    try {
      new PerformanceObserver(function (ds) {
        ds.getEntries().forEach(function (m) {
          if (m.name.indexOf("/api/v1/chat/init") !== -1) daInit = true;
        });
      }).observe({ type: "resource", buffered: true });
    } catch (e) {
      daInit = true; // trình duyệt quá cũ: bỏ qua bước chờ, dựa vào hạn 5 giây bên dưới
    }

    var lan = 0;
    var cho = setInterval(function () {
      lan++;
      var nut = document.getElementById("imob-toggle-btn");
      // Có nút + init xong; hoặc có nút đã 5 giây mà vẫn chưa thấy init thì bấm luôn.
      if (nut && (daInit || lan > 20)) {
        clearInterval(cho);
        setTimeout(function () {
          if (!document.querySelector(".imob-chatbox.open")) nut.click();
          // Máy tính: đưa con trỏ vào ô nhập. Điện thoại thì không, kẻo bàn
          // phím bật lên che nửa màn hình ngay khi vừa vào trang.
          if (window.matchMedia("(min-width: 768px)").matches) {
            var o = document.getElementById("imob-chat-input");
            if (o) setTimeout(function () { o.focus(); }, 300);
          }
        }, 150);
        return;
      }
      if (lan > 60) { // ~15 giây vẫn chưa có khung chat
        clearInterval(cho);
        document.getElementById("cho").innerHTML =
          "<p>Chưa kết nối được trợ lý ảo. Bạn tải lại trang, hoặc gọi " +
          "<a href=\"tel:0936982256\">0936 982 256</a> để được hỗ trợ.</p>";
      }
    }, 250);
  })();
</script>
