<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="iMob">
  <defs>
    <!-- Gradient tím neon (khớp bảng màu site: purple-500 → violet) -->
    <linearGradient id="g" x1="8" y1="6" x2="56" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#c4b5fd"/>
      <stop offset=".55" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <!-- Quầng sáng neon; feMerge giữ lại nét gốc nên favicon vẫn rõ dù trình
         duyệt bỏ qua filter khi thu nhỏ về 16px -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Nền squircle tối, đồng bộ nền site -->
  <rect width="64" height="64" rx="15" fill="#05050a"/>
  <rect x="1.75" y="1.75" width="60.5" height="60.5" rx="13.25" fill="none" stroke="url(#g)" stroke-width="1.5" opacity=".3"/>

  <!-- Nút nguồn ⏻ trong lục giác: vòng lục giác hở đỉnh + thanh dọc xuyên qua -->
  <g fill="none" stroke="url(#g)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <path d="M39.6 14.4 51 21 51 43 32 54 13 43 13 21 24.4 14.4"/>
    <path d="M32 8V30"/>
  </g>
</svg>
