<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ===== Áp bảng màu TRƯỚC khi trình duyệt vẽ khung hình đầu tiên =====
         Đoạn này phải nằm TRONG thẻ head và chạy đồng bộ. Nếu để React làm thì
         nó chỉ chạy sau khi tải xong bundle JS — người xem sẽ thấy trang hiện
         màu mặc định rồi mới nhảy sang bảng màu thật, chói mắt nhất là khi
         bảng màu là nền tối.

         Đọc hai khoá, theo đúng thứ tự ưu tiên:
           imob_bang_mau      — bảng người xem tự chọn ở widget ngoài trang chủ
           imob_bang_mau_web  — bảng CHÍNH THỨC của lần vào trước, React ghi lại
                                mỗi lần tải (xem src/context/BangMauContext.jsx)

         Không có khoá nào thì bỏ qua, trang chạy bằng bảng chàm tím mặc định
         khai trong @theme. Cố ý viết bằng JS thuần, không đụng tới mã màu nào. -->
    <script>
      try {
        var _bm =
          localStorage.getItem("imob_bang_mau") ||
          localStorage.getItem("imob_bang_mau_web");
        if (_bm) document.documentElement.dataset.bangMau = _bm;
      } catch (e) {
        /* trình duyệt chặn storage — bỏ qua, dùng bảng mặc định */
      }
    </script>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />

    <!-- ===== SEO cơ bản ===== -->
    <title>iMob — Solution & Technology | Giải pháp chuyển đổi số</title>
    <meta
      name="description"
      content="iMob — Solution & Technology. Phát triển Zalo MiniApp, phần mềm quản lý, ứng dụng di động và đào tạo chuyển đổi số. Tư vấn miễn phí, phản hồi trong 24h."
    />
    <meta name="author" content="iMob Solution & Technology" />
    <meta
      name="keywords"
      content="Zalo MiniApp, phần mềm quản lý, chuyển đổi số, thiết kế website, ứng dụng di động, chatbot AI"
    />
    <meta name="robots" content="index, follow" />

    <!-- Màu thanh trình duyệt trên điện thoại.
         Giá trị ở đây chỉ là mặc định (chàm tím). BangMauContext ghi đè theo
         đúng bảng màu đang dùng, nên đổi bảng màu là thanh trình duyệt đổi theo. -->
    <meta name="theme-color" content="#ffffff" />

    <!-- ===== Open Graph (Facebook, Zalo, LinkedIn) =====
         Quyết định "thẻ xem trước" khi ai đó dán link lên mạng xã hội.
         ⚠️ Khi deploy thật: đổi og:url thành tên miền thật, và bổ sung
         og:image (ảnh 1200×630 px, đặt trong public/) — thiếu ảnh thì
         link chia sẻ sẽ hiện ô trắng trơn, kém hấp dẫn. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="iMob Solution & Technology" />
    <meta
      property="og:title"
      content="iMob — Solution & Technology | Giải pháp chuyển đổi số"
    />
    <meta
      property="og:description"
      content="Phát triển Zalo MiniApp, phần mềm quản lý, ứng dụng di động và đào tạo chuyển đổi số. Tư vấn miễn phí, phản hồi trong 24h."
    />
    <meta property="og:locale" content="vi_VN" />
    <meta property="og:url" content="https://example.com/" />

    <!-- ===== Twitter/X ===== -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="iMob — Solution & Technology | Giải pháp chuyển đổi số"
    />
    <meta
      name="twitter:description"
      content="Phát triển Zalo MiniApp, phần mềm quản lý, ứng dụng di động và đào tạo chuyển đổi số."
    />

    <!-- ⚠️ Đổi thành tên miền thật khi deploy (báo cho Google biết đâu là
         địa chỉ chính thức, tránh bị coi là nội dung trùng lặp) -->
    <link rel="canonical" href="https://example.com/" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
