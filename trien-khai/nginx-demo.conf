# ============================================================
# nginx cho trang thử bot Demo: https://demo.imob.vn  (22/10/2026)
# Nền là tour VR360 bảo tàng, khung chat bot "Demo" của nền tảng chatbot.imob.vn.
# Chép từ nginx-chatbot.conf, chỉ đổi tên miền và thư mục.
#
# Phục vụ thư mục trang-demo/ trong bản website ĐANG CHẠY, nên mỗi lần
# triển khai website (trien-khai.sh) là trang này cập nhật theo, không cần làm
# gì thêm. Trang chỉ là file tĩnh — không có API, không có /admin.
#
# Đặt tên file "imob-demo" (đứng SAU "imob" theo thứ tự chữ cái) vì nó dùng
# log_format "co_ten_mien" khai báo trong file imob; nginx đọc các file trong
# sites-enabled theo thứ tự tên.
#
# Cài lần đầu:
#     sudo cp nginx-demo.conf /etc/nginx/sites-available/imob-demo
#     sudo ln -s /etc/nginx/sites-available/imob-demo /etc/nginx/sites-enabled/
#     sudo nginx -t && sudo systemctl reload nginx
#     sudo certbot --nginx -d demo.imob.vn      # bật HTTPS, tự thêm khối 443
#
# ⚠️ File này ĐÃ GỒM phần HTTPS certbot thêm (22/10/2026). Chép đè lên máy
# chủ là được, KHÔNG chạy lại certbot; chép bản cũ không có khối 443 là mất HTTPS.
#
# DNS: bản ghi A "demo" -> 162.4.8.113 tại Mắt Bão (nơi quản lý imob.vn).
#
# KHOÁ BOT KHÔNG NẰM TRONG GIT (kho mã công khai). index.html chỉ có chữ giữ
# chỗ __KHOA_BOT_DEMO__; nginx thay bằng khoá thật (sub_filter) đọc từ file
# chỉ có trên máy chủ:
#     /etc/nginx/imob-demo-khoa.conf   — đúng một dòng:
#     sub_filter '__KHOA_BOT_DEMO__' 'imob_live_...';
# Đổi khoá: sửa file đó rồi  sudo nginx -t && sudo systemctl reload nginx.
#
# ⚠️ Nền tảng chatbot (iMob CMS) chỉ trả lời các trang thuộc tên miền đã khai
# báo cho kho. Đổi tên miền con này thì phải khai báo lại bên nền tảng.
# ============================================================

# CHUYỂN TIẾP /api/ và /widget/ SANG chatbot.imob.vn (22/10/2026)
# Máy chủ chatbot (của Thắng, cùng máy CMC) chỉ trả lời trình duyệt từ một danh
# sách tên miền cố định, chưa có demo.imob.vn → khung chat bị chặn CORS (yêu cầu
# OPTIONS /api/v1/chat/init trả 400). Thay vì chờ sửa bên đó, trang demo gọi API
# qua CHÍNH tên miền của nó (data-api-base="https://demo.imob.vn"), nginx ở đây
# chuyển tiếp sang chatbot.imob.vn. Trình duyệt chỉ thấy một tên miền nên không
# còn CORS. Không đụng gì vào cấu hình của hệ thống chatbot.
# Khi Thắng đã cho phép demo.imob.vn: có thể trả data-api-base về
# https://chatbot.imob.vn và bỏ hai khối location này.
# ============================================================

server {
    server_name demo.imob.vn;

    root /var/www/imob/current/trang-demo;
    index index.html;

    server_tokens off;
    access_log /var/log/nginx/access.log co_ten_mien;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy     "geolocation=(), microphone=(), camera=()" always;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
    gzip_min_length 1024;

    # Trang HTML: luôn hỏi lại máy chủ, để sửa trang xong khách thấy ngay.
    location = /index.html {
        # Điền khoá bot vào chỗ giữ chỗ (xem đầu file).
        include /etc/nginx/imob-demo-khoa.conf;
        sub_filter_once off;   # chữ giữ chỗ còn xuất hiện trong ghi chú đầu trang
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options        "SAMEORIGIN" always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    }

    # API và file khung chat của nền tảng — chuyển tiếp sang chatbot.imob.vn
    # (xem đầu file). Đi qua nginx của chatbot.imob.vn chứ không gọi thẳng cổng
    # nội bộ, để mọi luật bên đó (giới hạn, log) vẫn áp dụng.
    location ~ ^/(api|widget)/ {
        proxy_pass https://chatbot.imob.vn;
        proxy_ssl_server_name on;
        proxy_set_header Host chatbot.imob.vn;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # Câu trả lời AI có thể truyền từng đoạn: không gom đệm, cho chờ lâu.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 120s;
    }

    location ~* \.(png|jpg|jpeg|webp|svg|ico)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ /\. {
        deny all;
        return 404;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/demo.imob.vn/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/demo.imob.vn/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = demo.imob.vn) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name demo.imob.vn;
    return 404; # managed by Certbot
}
