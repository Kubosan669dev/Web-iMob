# ============================================================
# nginx cho trang chatbot riêng: https://chatbot.imob.vn  (02/10/2026)
#
# Phục vụ thư mục trang-chatbot/ trong bản website ĐANG CHẠY, nên mỗi lần
# triển khai website (trien-khai.sh) là trang này cập nhật theo, không cần làm
# gì thêm. Trang chỉ là file tĩnh — không có API, không có /admin.
#
# Đặt tên file "imob-chatbot" (đứng SAU "imob" theo thứ tự chữ cái) vì nó dùng
# log_format "co_ten_mien" khai báo trong file imob; nginx đọc các file trong
# sites-enabled theo thứ tự tên.
#
# Cài lần đầu:
#     sudo cp nginx-chatbot.conf /etc/nginx/sites-available/imob-chatbot
#     sudo ln -s /etc/nginx/sites-available/imob-chatbot /etc/nginx/sites-enabled/
#     sudo nginx -t && sudo systemctl reload nginx
#     sudo certbot --nginx -d chatbot.imob.vn      # bật HTTPS, tự thêm khối 443
#
# DNS: bản ghi A "chatbot" -> 162.4.8.113 tại Mắt Bão (nơi quản lý imob.vn).
#
# ⚠️ Nền tảng chatbot (iMob CMS) chỉ trả lời các trang thuộc tên miền đã khai
# báo cho kho. Đổi tên miền con này thì phải khai báo lại bên nền tảng.
# ============================================================

server {
    listen 80;
    listen [::]:80;
    server_name chatbot.imob.vn;

    root /var/www/imob/current/trang-chatbot;
    index index.html;

    server_tokens off;
    access_log /var/log/nginx/access.log co_ten_mien;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy     "geolocation=(), microphone=(), camera=()" always;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
    gzip_min_length 1024;

    # Trang HTML: luôn hỏi lại máy chủ, để sửa trang xong khách thấy ngay.
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options        "SAMEORIGIN" always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    }

    location ~* \.(png|jpg|jpeg|webp|svg|ico)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ /\. {
        deny all;
        return 404;
    }
}
