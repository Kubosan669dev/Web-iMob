# ============================================================
# Cấu hình nginx cho website iMob.
#
# nginx là CỬA DUY NHẤT ra internet. Website tĩnh và API đi chung một tên miền,
# nginx nhìn đường dẫn để quyết định đưa đi đâu:
#
#     https://ten-mien.vn/            -> file tĩnh trong /var/www/imob/dist
#     https://ten-mien.vn/api/...     -> uvicorn ở 127.0.0.1:8001
#
# ⭐ HỆ QUẢ QUAN TRỌNG: trình duyệt và API cùng một tên miền, nên KHÔNG CÒN
# CORS. Cả lớp lỗi "quên điền ALLOWED_ORIGINS thì chatbot chết" của bản Render
# biến mất. Cứ để VITE_API_URL TRỐNG khi build (xem src/utils/constants.js:83)
# thì mã nguồn tự gọi đường dẫn tương đối /api/*.
#
# Chép lên máy chủ:
#     sudo cp nginx-imob.conf /etc/nginx/sites-available/imob
#     sudo ln -s /etc/nginx/sites-available/imob /etc/nginx/sites-enabled/
#     sudo rm -f /etc/nginx/sites-enabled/default
#     sudo nginx -t && sudo systemctl reload nginx
#
# ⚠️ Thay TEN_MIEN.VN bằng tên miền thật trước khi dùng.
#    Chưa có tên miền thì điền địa chỉ IP và bỏ qua bước cài HTTPS.
# ============================================================

# Giới hạn tần suất gọi API: mỗi địa chỉ truy cập tối đa 10 lượt/giây.
# Đặt ở đây (mức http) chứ không đặt trong server{}.
limit_req_zone $binary_remote_addr zone=api_imob:10m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name TEN_MIEN.VN www.TEN_MIEN.VN;

    root /var/www/imob/current/dist;
    index index.html;

    # Ẩn phiên bản nginx trong tiêu đề trả về — bớt thông tin cho người dò tìm.
    server_tokens off;

    # ---- Các tiêu đề an toàn ----
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;

    # Nén văn bản. Ảnh và webp đã nén sẵn rồi, nén lại chỉ tốn CPU.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Tệp tải lên có thể là ảnh -> nới giới hạn (mặc định nginx chỉ 1 MB).
    client_max_body_size 12M;

    # ---------------------------------------------------------
    # API -> chuyển sang uvicorn chạy trong máy
    # ---------------------------------------------------------
    location /api/ {
        limit_req zone=api_imob burst=20 nodelay;

        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        # Thiếu dòng X-Forwarded-For thì phần khoá IP khi dò mật khẩu (sai 5
        # lần khoá 15 phút) sẽ thấy MỌI người dùng đều đến từ 127.0.0.1 —
        # tức là một người gõ sai sẽ khoá luôn tất cả khách. Bắt buộc phải có.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP         $remote_addr;

        # Chatbot có lúc phải hỏi thêm Gemini nên trả lời chậm hơn bình thường.
        proxy_read_timeout 60s;
    }

    # Đường dẫn kiểm tra tình trạng máy chủ. Nó nằm ở /health chứ KHÔNG nằm
    # dưới /api/, nên phải khai báo riêng — không thì nginx coi đây là đường
    # dẫn của website và trả về index.html, lúc đó lệnh kiểm tra lúc nào cũng
    # "thành công" trong khi API có thể đã chết từ lâu.
    location = /health {
        proxy_pass http://127.0.0.1:8001/health;
        proxy_set_header Host $host;
        access_log off;
    }

    # ---------------------------------------------------------
    # Tệp tĩnh
    # ---------------------------------------------------------
    # Tệp trong /assets có mã băm trong tên (index-a1b2c3.js): nội dung đổi thì
    # tên đổi, nên cho trình duyệt giữ lại 1 năm cũng không sợ cũ.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /anh/ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # ---------------------------------------------------------
    # Luật cuối: mọi đường dẫn không phải tệp thật đều trả index.html
    #
    # BẮT BUỘC với React Router. Khách gõ thẳng /zalo-miniapp thì nginx đi tìm
    # tệp tên "zalo-miniapp", không có -> 404. Dòng dưới bảo nginx cứ trả
    # index.html để React Router tự quyết định hiện trang nào.
    # ---------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Chặn truy cập các tệp ẩn (.env, .git/...) nếu lỡ nằm nhầm trong dist.
    location ~ /\. {
        deny all;
        return 404;
    }
}
